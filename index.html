<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050b18" id="themeColor">

<meta name="apple-mobile-web-app-capable" content="yes">
<title>Star Finder · ส่องดาว</title>
<style>
:root{--bg:#050b18;--panel:rgba(9,18,35,.88);--line:#27405f;--gold:#ffd98a;--cyan:#7cc8ff;--muted:#9fb3cc;--text:#eef4ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Thai",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:0}
body.cam #camera{display:block}
#sky{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;z-index:1}
.reticle{position:fixed;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border:1.5px solid rgba(124,200,255,.85);border-radius:50%;pointer-events:none;z-index:2}
.reticle:before,.reticle:after{content:"";position:absolute;background:rgba(124,200,255,.85)}
.reticle:before{left:50%;top:-12px;bottom:-12px;width:1.5px;margin-left:-.75px}
.reticle:after{top:50%;left:-12px;right:-12px;height:1.5px;margin-top:-.75px}
.top{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;justify-content:center;pointer-events:none;z-index:3}
.pill{background:rgba(5,11,24,.74);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);white-space:nowrap}
.pill b{color:var(--gold)}
#redBtn{position:absolute;right:0;top:0;pointer-events:auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(5,11,24,.74);font-size:17px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.top .pill{max-width:calc(100% - 96px);overflow:hidden;text-overflow:ellipsis}
/* ---- Red Night Mode: ชั้นกรองแสงที่ตัดสีเขียว/น้ำเงินออกทั้งหมด เหลือแต่แสงแดง ---- */
#redFilter{position:fixed;inset:0;z-index:1000;pointer-events:none;display:none;background:#ff0000;mix-blend-mode:multiply}
html.red #redFilter{display:block}
html.red.dim #redFilter{background:#8a0000}
html.red,html.red body{background:#000}
html.red #camera{filter:grayscale(1) brightness(.7)}
html.red #redBtn{background:#3a0000;border-color:#ff4040}
html.red .btn.on,html.red #stSpeak.playing,html.red #startBtn{background:#5a0000;color:#fff;border-color:#a00}
#introRed{margin-top:10px;background:none;border:1px solid #6a2a2a;color:#ff8080;border-radius:12px;padding:8px 14px;font-size:14px;cursor:pointer}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 56px);transform:translateX(-50%);background:rgba(231,189,112,.95);color:#14213a;padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;z-index:5;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:6px 14px calc(env(safe-area-inset-bottom) + 12px);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);max-width:720px;margin:0 auto}
.grab{width:100%;padding:6px 0 8px;cursor:pointer}.grab i{display:block;width:40px;height:4px;border-radius:4px;background:#4a6688;margin:0 auto}
.kicker{font-size:11px;color:var(--muted);letter-spacing:.04em}
#conName{font-size:20px;font-weight:700;color:var(--gold);line-height:1.3}
#conSub{font-size:12px;color:var(--muted);margin-top:2px}
#lore{font-size:13px;line-height:1.55;margin:6px 0 0;color:#d6e2f3}
.sheet.min .more{display:none}
.row{display:flex;gap:8px;align-items:center;margin-top:10px}
select,button,input{font:inherit}
select{flex:1;min-width:0;background:#0a1830;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 8px;font-size:14px}
.btn{background:#13284a;color:var(--text);border:1px solid #33507a;border-radius:10px;padding:9px 10px;font-size:13px;white-space:nowrap;cursor:pointer}
.btn.on{background:#e7bd70;color:#14213a;border-color:#e7bd70;font-weight:600}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
#guide{font-size:15px;text-align:center;padding:9px;border:1px dashed #3f5d80;border-radius:10px;margin-top:8px;display:none;line-height:1.5}
#guide.found{border-color:#7be0a0;color:#9ff0bd}
#guide small{display:block;font-size:12px;color:var(--muted)}
.timebox{display:none;gap:8px;align-items:center;margin-top:10px;font-size:13px}.timebox.show{display:flex}
input[type=range]{flex:1;accent-color:#e7bd70}
#status{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
#status.warn{color:#ffb38a}
#intro{position:fixed;inset:0;z-index:10;background:radial-gradient(ellipse at 50% 30%,#14305a 0%,#050b18 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
#intro h1{font-size:30px;margin:0 0 6px}#intro h1 span{color:var(--gold)}
#intro p{color:var(--muted);font-size:14px;line-height:1.6;max-width:360px;margin:6px 0}
#startBtn{margin-top:22px;background:#e7bd70;color:#14213a;border:0;border-radius:14px;padding:15px 30px;font-size:17px;font-weight:700;cursor:pointer}
#noSensorBtn{margin-top:12px;background:none;border:0;color:var(--cyan);font-size:14px;text-decoration:underline;cursor:pointer}
#introWarn{color:#ffb38a !important}
.headrow{display:flex;align-items:flex-start;gap:10px}.headrow>div{flex:1;min-width:0}
#storyBtn{flex:none;margin-top:12px}
.story{position:fixed;left:0;right:0;bottom:0;z-index:8;max-width:720px;margin:0 auto;max-height:78vh;display:flex;flex-direction:column;background:#0c162a;border-top:1px solid #4a6688;border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);box-shadow:0 -10px 40px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .3s ease}
.story.open{transform:none}
.storyHead{display:flex;gap:10px;align-items:flex-start}.storyHead>div{flex:1;min-width:0}
#stTitle{font-size:20px;margin:2px 0;color:var(--gold);line-height:1.35}
#stSub{font-size:12px;color:var(--muted)}
#stClose{background:#1b3156;border:1px solid #3b5a85;color:var(--text);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;flex:none}
#stBody{overflow-y:auto;-webkit-overflow-scrolling:touch;margin:10px 0;font-size:16px;line-height:1.85;color:#e3ecf8;-webkit-user-select:text;user-select:text}
#stBody span{border-radius:6px;padding:1px 2px;transition:background .2s,color .2s}
#stBody span.reading{background:rgba(231,189,112,.25);color:#fff4d8}
.storyBtns{display:flex;gap:8px}.storyBtns .btn{flex:1;padding:12px;font-size:15px}
#stSpeak.playing{background:#ff9d7a;border-color:#ff9d7a;color:#2a1208}
#stRate{flex:0 0 auto !important}
#stVoiceNote{font-size:11px;color:#ffb38a;margin-top:8px;line-height:1.5}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="sky"></canvas>
<div class="reticle"></div>
<div class="top"><span class="pill" id="dirPill">กำลังเตรียมท้องฟ้า…</span><button id="redBtn" aria-label="โหมดแสงแดงสำหรับกลางคืน" title="Red Night Mode">🔴</button></div>
<div id="toast"></div>

<div class="sheet" id="sheet">
  <div class="grab" id="grab"><i></i></div>
  <div class="headrow"><div>
    <div class="kicker">กำลังชี้ไปที่กลุ่มดาว</div>
    <div id="conName">—</div>
    <div id="conSub">—</div>
  </div><button class="btn" id="storyBtn">📖 ตำนาน</button></div>
  <div class="row"><select id="target" aria-label="เลือกเป้าหมาย"><option value="">🎯 เลือกเป้าหมายเพื่อนำทาง…</option></select></div>
  <div id="guide"></div>
  <div class="more">
    <p id="lore"></p>
    <div class="btns">
      <button class="btn" id="camBtn">📷 AR</button>
      <button class="btn" id="sensorBtn">🧭 เซนเซอร์</button>
      <button class="btn" id="timeBtn">🕘 เวลา</button>
      <button class="btn" id="gridBtn">▦ เส้นกริด</button>
    </div>
    <div class="timebox" id="timebox"><input type="range" id="timeRange" min="-720" max="720" step="10" value="0"><span id="timeLabel">ตอนนี้</span><button class="btn" id="nowBtn">ตอนนี้</button></div>
    <div id="status"></div>
  </div>
</div>

<div class="story" id="story" aria-hidden="true">
  <div class="storyHead"><div><div class="kicker">📖 ตำนานดาว</div><h2 id="stTitle"></h2><div id="stSub"></div></div><button id="stClose" aria-label="ปิด">✕</button></div>
  <div id="stBody"></div>
  <div class="storyBtns"><button class="btn" id="stSpeak">🔊 อ่านออกเสียง</button><button class="btn" id="stRate">ช้า</button><button class="btn" id="stFind">🎯 หาบนฟ้า</button></div>
  <div id="stVoiceNote"></div>
</div>

<div id="intro">
  <h1>✨ Star <span>Finder</span></h1>
  <p>ยกมือถือขึ้นฟ้า แล้วหมุนไปรอบ ๆ แอปจะใช้ <b>GPS + เวลา + เข็มทิศ + ไจโร</b> คำนวณว่าคุณกำลังชี้ไปที่กลุ่มดาวอะไร</p>
  <p>เมื่อกดเริ่ม เบราว์เซอร์จะขอสิทธิ์ <b>Motion &amp; Orientation</b> และ <b>Location</b> — กด “อนุญาต” ทั้งสองอย่าง</p>
  <p id="introWarn"></p>
  <button id="startBtn">เริ่มส่องดาว</button>
  <button id="noSensorBtn">ใช้แบบลากนิ้ว (ไม่ใช้เซนเซอร์)</button>
  <button id="introRed">🔴 เปิดโหมดแสงแดง (ถนอมสายตาตอนกลางคืน)</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>

 'เหล่าเทพนำทั้งนายพรานและแมงป่องขึ้นไปไว้บนท้องฟ้า แต่ให้อยู่คนละฟากกัน',
 'เมื่อกลุ่มดาวแมงป่องขึ้นทางทิศตะวันออก กลุ่มดาวนายพรานก็จะลับขอบฟ้าไปทางทิศตะวันตก ทั้งคู่จึงแทบไม่เคยปรากฏบนฟ้าพร้อมกันอีกเลย',
 'ส่วนคนไทยมองดาวสามดวงที่เป็นเข็มขัด กับดาวที่เรียงต่อลงมา เป็นรูป “ดาวไถ” เหมือนคันไถของชาวนา',
 'ลองสังเกตดาวบีเทลจุสสีส้มแดงที่ไหล่ และดาวไรเจลสีขาวอมฟ้าที่เท้า สีที่ต่างกันบอกเราว่าดาวสองดวงนี้ร้อนไม่เท่ากัน']},
SCORPIUS:{t:'แมงป่องผู้ไล่ล่านายพราน',p:[
 'ในตำนานกรีก แมงป่องตัวนี้คือแมงป่องยักษ์ที่พระแม่ธรณีไกอาส่งมาหยุดนายพรานโอไรออน ผู้คุยโวว่าจะล่าสัตว์ทุกตัวบนโลก',
 'แมงป่องต่อยโอไรออนจนสิ้นใจ เหล่าเทพจึงยกทั้งคู่ขึ้นฟ้า แต่วางไว้คนละฟาก',
 'ทุกวันนี้ เมื่อแมงป่องโผล่ขึ้นทางทิศตะวันออก นายพรานจะลับขอบฟ้าไปทางทิศตะวันตก ราวกับยังหนีแมงป่องอยู่',
 'หัวใจของแมงป่องคือดาวแอนทาเรส ดาวยักษ์สีแดง ชื่อนี้แปลว่า “คู่แข่งของดาวอังคาร” เพราะมีสีแดงคล้ายกัน',
 'ในประเทศไทย กลุ่มดาวแมงป่องเห็นชัดทางทิศใต้ช่วงหัวค่ำเดือนพฤษภาคมถึงสิงหาคม ลองมองหาหางที่โค้งเป็นตะขอ']},
UMA:{t:'คาลลิสโต แม่หมีบนท้องฟ้า',p:[
 'ในตำนานกรีก คาลลิสโตเป็นนางไม้ผู้งดงาม มีบุตรชายกับเทพซุสชื่ออาร์คัส',
 'เทพีเฮรา มเหสีของซุส ริษยาจึงสาปคาลลิสโตให้กลายเป็นหมี นางต้องเร่ร่อนอยู่ในป่าเพียงลำพัง',
 'หลายปีต่อมา อาร์คัสเติบโตเป็นนายพราน วันหนึ่งเขาพบหมีตัวหนึ่งในป่าและกำลังจะยิงธนู โดยไม่รู้เลยว่าหมีตัวนั้นคือแม่ของตน',
 'ซุสเห็นเข้าจึงเปลี่ยนอาร์คัสให้เป็นหมีตัวเล็ก แล้วคว้าหางหมีทั้งสองเหวี่ยงขึ้นไปบนฟ้า หางของหมีบนฟ้าจึงยาวกว่าหมีจริง ๆ',
 'ส่วนคนไทยมองดาวเจ็ดดวงที่เรียงเป็นรูปกระบวยว่าเป็น “ดาวจระเข้”',
 'เคล็ดลับ ลากเส้นต่อจากดาวสองดวงที่ปลายกระบวยออกไปประมาณห้าเท่าของระยะห่าง จะพบดาวเหนือ']},
UMI:{t:'ลูกหมีกับดาวเหนือ',p:[
 'ตามตำนานกรีก หมีเล็กคืออาร์คัส บุตรชายของคาลลิสโต ซุสเปลี่ยนเขาเป็นหมีแล้วยกขึ้นไปอยู่ใกล้แม่บนท้องฟ้า',
 'ปลายหางของหมีเล็กคือดาวเหนือ หรือโพลาริส ซึ่งอยู่เกือบตรงขั้วฟ้าเหนือพอดี',
 'ขณะที่ดาวดวงอื่นหมุนไปรอบท้องฟ้าตลอดคืน ดาวเหนือแทบไม่ขยับเลย นักเดินทางและนักเดินเรือจึงใช้ดาวเหนือบอกทิศเหนือมาหลายร้อยปี',
 'ความสูงของดาวเหนือจากขอบฟ้าเท่ากับละติจูดของผู้สังเกต ที่กรุงเทพฯ จึงเห็นดาวเหนืออยู่ต่ำ ประมาณ 14 องศา ต้องมองทางทิศเหนือในที่ที่ไม่มีตึกบัง']},
LYRA:{t:'พิณของออร์เฟียส และเจ้าหญิงทอผ้า',p:[
 'ในตำนานกรีก ออร์เฟียสเป็นนักดนตรีที่เก่งที่สุดในโลก เมื่อเขาดีดพิณ แม้แต่ต้นไม้และก้อนหินยังโอนเอนตามเสียงเพลง',
 'วันหนึ่ง ยูริไดซี ภรรยาที่เขารักถูกงูกัดจนเสียชีวิต ออร์เฟียสจึงเดินทางลงไปยังยมโลก',
 'เขาดีดพิณจนเทพเฮดีสผู้ครองยมโลกใจอ่อน ยอมให้พาภรรยากลับ แต่มีข้อแม้ว่าห้ามหันหลังกลับไปมองจนกว่าจะถึงโลกมนุษย์',
 'เมื่อเกือบถึงทางออก ออร์เฟียสอดใจไม่ไหวหันไปมอง ยูริไดซีจึงหายกลับไปยังยมโลกตลอดกาล',
 'หลังจากออร์เฟียสสิ้นชีวิต เหล่าเทพจึงนำพิณของเขาขึ้นไปไว้บนท้องฟ้า',
 'ส่วนในตำนานจีน ดาวเวกาคือเจ้าหญิงทอผ้าแห่งสวรรค์ ผู้ตกหลุมรักหนุ่มเลี้ยงวัว ซึ่งก็คือดาวอัลแทร์',
 'ทั้งคู่ถูกทางช้างเผือกกั้นไว้คนละฝั่ง และได้พบกันเพียงปีละครั้ง ในคืนวันที่เจ็ด เดือนเจ็ด ตามปฏิทินจันทรคติ เมื่อฝูงนกบินมาต่อตัวกันเป็นสะพานข้ามทางช้างเผือก']},
AQUILA:{t:'นกอินทรีของซุส และหนุ่มเลี้ยงวัว',p:[
 'ในตำนานกรีก นกอินทรีตัวนี้เป็นสัตว์คู่ใจของเทพซุส มีหน้าที่ถือสายฟ้าอันทรงพลังให้ซุส',
 'ครั้งหนึ่งซุสส่งนกอินทรีลงมายังโลก ไปรับเด็กหนุ่มเลี้ยงแกะชื่อแกนีมีด ขึ้นไปเป็นผู้รินน้ำทิพย์ให้เหล่าเทพบนเขาโอลิมปัส',
 'ดาวที่สว่างที่สุดของกลุ่มนี้คือดาวอัลแทร์ ซึ่งในตำนานจีนคือหนุ่มเลี้ยงวัว คนรักของเจ้าหญิงทอผ้า หรือดาวเวกา',
 'ทั้งสองอยู่คนละฝั่งของทางช้างเผือก และได้พบกันเพียงปีละครั้งในคืนวันที่เจ็ด เดือนเจ็ด',
 'อัลแทร์ เวกา และเดเนบ รวมกันเป็นรูป “สามเหลี่ยมฤดูร้อน” ที่เห็นได้ชัดในช่วงหัวค่ำเดือนกรกฎาคมถึงตุลาคม']},
CYGNUS:{t:'หงส์ผู้ภักดี',p:[
 'ในตำนานกรีก ฟีทอนเป็นบุตรของเทพแห่งดวงอาทิตย์ เขาขอยืมรถม้าเทียมดวงอาทิตย์ไปขับ แต่ควบคุมม้าไม่ได้ ซุสจึงต้องใช้สายฟ้าฟาด ฟีทอนตกลงไปในแม่น้ำอีริดานัส',
 'ไซกนัส เพื่อนรักของฟีทอน ดำน้ำลงไปค้นหาร่างเพื่อนครั้งแล้วครั้งเล่าอย่างไม่ยอมแพ้',
 'เหล่าเทพสงสารในความภักดี จึงเปลี่ยนไซกนัสให้เป็นหงส์ และนำขึ้นไปไว้บนท้องฟ้า',
 'กลุ่มดาวหงส์บินอยู่บนแนวทางช้างเผือกพอดี บางครั้งจึงเรียกว่า “กางเขนเหนือ” เพราะดาวเรียงเป็นรูปไม้กางเขน',
 'หางของหงส์คือดาวเดเนบ ดาวยักษ์ที่อยู่ไกลมาก แต่ยังสว่างจนเรามองเห็นได้ด้วยตาเปล่า']},
TAURUS:{t:'วัวขาวของซุส และดาวลูกไก่',p:[
 'ในตำนานกรีก ซุสแปลงกายเป็นวัวขาวผู้อ่อนโยน เพื่อเข้าใกล้เจ้าหญิงยุโรปาที่กำลังเล่นอยู่ริมทะเล',
 'เมื่อเจ้าหญิงขึ้นไปนั่งบนหลัง วัวขาวก็ว่ายน้ำข้ามทะเลไปยังเกาะครีต ชื่อทวีปยุโรปมาจากชื่อของเจ้าหญิงองค์นี้',
 'ตาของวัวคือดาวอัลเดบารันสีส้ม ส่วนบนหลังวัวมีกระจุกดาวเล็ก ๆ ที่คนไทยเรียกว่า “ดาวลูกไก่”',
 'ตำนานไทยเล่าว่า ตายายคู่หนึ่งเลี้ยงแม่ไก่กับลูกเจี๊ยบไว้ วันหนึ่งมีพระธุดงค์มาพักที่หมู่บ้าน ตายายไม่มีอะไรจะทำอาหารถวาย จึงคิดจะฆ่าแม่ไก่',
 'แม่ไก่รู้ก็ร่ำลาลูก ๆ ด้วยความเศร้า เมื่อแม่ไก่ถูกฆ่า ลูกไก่ทั้งหกตัวก็กระโดดเข้ากองไฟตามแม่ไปด้วยความรัก',
 'เทวดาเห็นความกตัญญู จึงนำแม่ไก่และลูกไก่ขึ้นไปเป็นดาวลูกไก่บนท้องฟ้า ให้อยู่ด้วยกันตลอดไป']},
CMA:{t:'สุนัขของนายพราน และดาวที่สว่างที่สุด',p:[
 'ในตำนานกรีก สุนัขใหญ่คือสุนัขล่าเนื้อคู่ใจของนายพรานโอไรออน มันวิ่งตามเจ้านายไปบนท้องฟ้าทุกคืน',
 'อีกตำนานเล่าถึงสุนัขชื่อไลแลปส์ ที่ไม่มีเหยื่อตัวใดหนีพ้น มันถูกส่งไปไล่จับสุนัขจิ้งจอกที่ไม่มีใครจับได้',
 'การไล่ล่านี้ไม่มีวันจบ ซุสจึงเปลี่ยนทั้งคู่ให้กลายเป็นหิน แล้วนำสุนัขขึ้นไปไว้บนท้องฟ้า',
 'ที่ปากของสุนัขคือดาวซิริอุส ดาวฤกษ์ที่สว่างที่สุดบนท้องฟ้ายามค่ำคืน อยู่ห่างจากโลกประมาณ 8.6 ปีแสง',
 'ชาวอียิปต์โบราณสังเกตว่า เมื่อดาวซิริอุสโผล่ขึ้นก่อนดวงอาทิตย์ในยามเช้า แม่น้ำไนล์ก็ใกล้ถึงฤดูน้ำหลาก',
 'เคล็ดลับ ลากเส้นจากเข็มขัดนายพรานลงไปทางซ้าย จะพบดาวซิริอุส']},
CMI:{t:'สุนัขตัวเล็กของนายพราน',p:[
 'สุนัขเล็กเป็นสุนัขอีกตัวหนึ่งของนายพรานโอไรออน คอยวิ่งตามอยู่ไม่ห่างจากสุนัขใหญ่',
 'ดาวดวงเด่นคือโพรซีออน ชื่อนี้แปลว่า “ก่อนสุนัข” เพราะมักโผล่ขึ้นจากขอบฟ้าก่อนดาวซิริอุสของสุนัขใหญ่เล็กน้อย',
 'โพรซีออน ซิริอุส และบีเทลจุส รวมกันเป็นรูป “สามเหลี่ยมฤดูหนาว” ที่เห็นชัดในช่วงหัวค่ำเดือนธันวาคมถึงมีนาคม']},
GEMINI:{t:'ฝาแฝดผู้ไม่ยอมพรากจากกัน',p:[
 'ในตำนานกรีก แคสเตอร์และพอลลักซ์เป็นพี่น้องฝาแฝดที่รักกันมาก แคสเตอร์เป็นมนุษย์ธรรมดา ส่วนพอลลักซ์เป็นบุตรของซุสจึงเป็นอมตะ',
 'ทั้งคู่ออกผจญภัยด้วยกันเสมอ รวมถึงร่วมเดินทางไปกับเรืออาร์โกเพื่อตามหาขนแกะทองคำ',
 'เมื่อแคสเตอร์ถูกสังหารในการต่อสู้ พอลลักซ์เศร้าโศกมาก จึงขอให้ซุสแบ่งความเป็นอมตะของตนให้พี่ชาย',
 'ซุสซาบซึ้งในความรักของพี่น้อง จึงนำทั้งสองขึ้นไปอยู่เคียงกันบนท้องฟ้าตลอดไป',
 'ชาวเรือในสมัยโบราณนับถือฝาแฝดคู่นี้เป็นผู้คุ้มครองการเดินเรือ',
 'มองหาดาวสว่างสองดวงที่อยู่ใกล้กัน นั่นคือหัวของฝาแฝดทั้งสอง']},
LEO:{t:'สิงโตแห่งนีเมีย',p:[
 'ในตำนานกรีก สิงโตแห่งนีเมียเป็นสัตว์ร้ายที่มีหนังเหนียวมาก ดาบ หอก หรือลูกธนูก็ทำอะไรมันไม่ได้',
 'เฮอร์คิวลีส วีรบุรุษผู้แข็งแรงที่สุด ได้รับภารกิจแรกในสิบสองภารกิจให้ปราบสิงโตตัวนี้',
 'เมื่ออาวุธใช้ไม่ได้ผล เฮอร์คิวลีสจึงเข้าปล้ำและรัดคอสิงโตด้วยมือเปล่าจนสำเร็จ แล้วนำหนังของมันมาสวมเป็นเกราะ',
 'เทพีเฮราจึงนำสิงโตขึ้นไปไว้บนท้องฟ้า',
 'หัวของสิงโตเป็นรูปเคียว คล้ายเครื่องหมายคำถามกลับด้าน ดาวสว่างที่ปลายเคียวคือดาวเรกูลัส แปลว่า “ราชาน้อย”']},
VIRGO:{t:'เทพีแห่งการเก็บเกี่ยวและฤดูกาล',p:[
 'ชาวกรีกเชื่อมโยงกลุ่มดาวหญิงสาวกับเทพีดีมิเทอร์ เทพีแห่งการเพาะปลูก และเพอร์เซโฟนีธิดาของนาง',
 'วันหนึ่งเทพเฮดีสผู้ครองยมโลกลักพาเพอร์เซโฟนีไปเป็นมเหสี ดีมิเทอร์โศกเศร้าจนพืชพันธุ์ทั่วโลกเหี่ยวเฉา',
 'ซุสจึงสั่งให้เฮดีสคืนเพอร์เซโฟนี แต่เพราะนางกินเมล็ดทับทิมในยมโลกไปแล้ว นางจึงต้องกลับไปอยู่ยมโลกปีละช่วงหนึ่ง',
 'ช่วงที่ลูกสาวจากไป ดีมิเทอร์เศร้า โลกจึงหนาวเย็นเป็นฤดูหนาว เมื่อลูกกลับมา ดอกไม้ก็บานเป็นฤดูใบไม้ผลิ',
 'ดาวสว่างของกลุ่มนี้คือดาวสไปกา แปลว่า “รวงข้าว” ที่หญิงสาวถืออยู่ในมือ']},
BOOTES:{t:'ผู้ไล่ต้อนหมี',p:[
 'กลุ่มดาวคนเลี้ยงสัตว์มีรูปร่างคล้ายว่าวหรือกรวยไอศกรีม ชาวกรีกมองว่าเป็นชายที่คอยไล่ต้อนหมีใหญ่ให้หมุนรอบขั้วฟ้าเหนือไม่หยุด',
 'ดาวดวงเด่นคืออาร์คทูรัส ชื่อนี้แปลว่า “ผู้เฝ้าหมี” เป็นดาวยักษ์สีส้มที่สว่างเป็นอันดับสี่ของท้องฟ้ายามค่ำคืน',
 'เคล็ดลับ ลากเส้นโค้งต่อจากด้ามกระบวยของหมีใหญ่ออกไป จะพบอาร์คทูรัส แล้วโค้งต่อไปอีกจะถึงดาวสไปกาในกลุ่มดาวหญิงสาว']},
SGR:{t:'คนครึ่งม้านักแม่นธนู',p:[
 'ชาวกรีกมองกลุ่มดาวนี้เป็นคนครึ่งม้าที่กำลังน้าวคันธนู ลูกศรเล็งไปที่ดาวแอนทาเรส หัวใจของแมงป่อง ราวกับคอยปกป้องท้องฟ้าจากแมงป่องตัวนั้น',
 'ปัจจุบันคนนิยมมองดาวสว่างของกลุ่มนี้เป็นรูป “กาน้ำชา” มีทั้งพวยกา หูจับ และฝา',
 'ไอน้ำที่พวยพุ่งจากกาน้ำชาคือแสงฟุ้ง ๆ ของทางช้างเผือก เพราะทิศนี้ชี้ไปยังใจกลางดาราจักรของเรา',
 'ที่ใจกลางนั้นมีหลุมดำมวลยิ่งยวด ซึ่งมีมวลประมาณสี่ล้านเท่าของดวงอาทิตย์']},
PERSEUS:{t:'เพอร์ซิอัส ผู้ช่วยเจ้าหญิงแอนดรอเมดา',p:[
 'ในตำนานกรีก ราชินีแคสสิโอเปียคุยโวว่า ตนและเจ้าหญิงแอนดรอเมดาผู้เป็นธิดา งดงามกว่าเหล่านางไม้แห่งท้องทะเล',
 'เทพโพไซดอนโกรธมาก จึงส่งอสูรทะเลซีตัสมาอาละวาดทำลายบ้านเมือง',
 'พระราชาซีฟิอัสได้รับคำทำนายว่าต้องสังเวยแอนดรอเมดาให้อสูร เจ้าหญิงจึงถูกล่ามโซ่ไว้กับโขดหินริมทะเล',
 'ขณะนั้นวีรบุรุษเพอร์ซิอัสเพิ่งปราบเมดูซา นางปีศาจผมงูที่ใครสบตาจะกลายเป็นหิน เขาบินผ่านมาและเห็นเจ้าหญิงตกอยู่ในอันตราย',
 'เมื่ออสูรซีตัสโผล่ขึ้นจากทะเล เพอร์ซิอัสชูหัวเมดูซาขึ้น อสูรร้ายกลายเป็นหินทันที เขาช่วยแอนดรอเมดาไว้ได้ และทั้งคู่ก็แต่งงานกัน',
 'ม้าบินเพกาซัสถือกำเนิดขึ้นตอนที่เมดูซาถูกปราบ ตัวละครทั้งหมดในเรื่องนี้จึงอยู่ใกล้กันบนท้องฟ้า ทั้งราชา ราชินี เจ้าหญิง วีรบุรุษ ม้าบิน และอสูรทะเล',
 'ราชินีแคสสิโอเปียถูกลงโทษให้นั่งบนบัลลังก์หมุนรอบขั้วฟ้า บางเวลาจึงต้องห้อยหัวลง',
 'ส่วนดาวอัลกอลในกลุ่มดาวเพอร์ซิอัส ถูกมองว่าเป็นดวงตาของเมดูซา ความสว่างของมันจะหรี่ลงทุก ๆ ประมาณ 2.9 วัน']},
ARGO:{t:'เรืออาร์โก ตามหาขนแกะทองคำ',p:[
 'ในตำนานกรีก เจสันได้รับภารกิจให้ไปนำขนแกะทองคำกลับมา เพื่อทวงบัลลังก์ที่ถูกแย่งชิงไป',
 'เขาต่อเรือลำใหญ่ชื่ออาร์โก และรวบรวมวีรบุรุษราวห้าสิบคนร่วมเดินทาง เรียกว่าเหล่าอาร์โกนอต ในนั้นมีทั้งเฮอร์คิวลีส ออร์เฟียส และฝาแฝดแคสเตอร์กับพอลลักซ์',
 'พวกเขาฝ่าอันตรายมากมาย ทั้งหินยักษ์ที่กระแทกเข้าหากัน และมังกรที่ไม่เคยหลับซึ่งเฝ้าขนแกะทองคำ ก่อนจะทำภารกิจสำเร็จ',
 'เรืออาร์โกถูกนำขึ้นไปไว้บนท้องฟ้า เดิมเป็นกลุ่มดาวขนาดใหญ่มาก ต่อมานักดาราศาสตร์จึงแบ่งออกเป็นสามกลุ่ม คือ กระดูกงูเรือ ท้ายเรือ และใบเรือ',
 'ดาวคาโนปัสในกลุ่มกระดูกงูเรือ เป็นดาวที่สว่างเป็นอันดับสองของท้องฟ้า ในประเทศไทยจะเห็นอยู่ต่ำทางทิศใต้']},
ARIES:{t:'แกะขนทองคำ',p:[
 'ในตำนานกรีก เจ้าชายฟริกซัสและเจ้าหญิงเฮลลีถูกแม่เลี้ยงใจร้ายวางแผนกำจัด',
 'แกะวิเศษขนทองคำบินลงมาช่วย พาสองพี่น้องหนีข้ามทะเลไป ระหว่างทางเฮลลีพลัดตกลงไปในทะเล แต่ฟริกซัสไปถึงแดนโคลคิสได้อย่างปลอดภัย',
 'ขนแกะทองคำถูกแขวนไว้ในป่าศักดิ์สิทธิ์ มีมังกรเฝ้าไว้ จนกระทั่งเจสันและเหล่าอาร์โกนอตเดินทางมานำกลับไป',
 'ส่วนตัวแกะถูกนำขึ้นไปเป็นกลุ่มดาวแกะบนท้องฟ้า เป็นหนึ่งในกลุ่มดาวจักรราศี']},
HYDRA:{t:'งูไฮดราหลายหัว',p:[
 'ไฮดราเป็นงูน้ำยักษ์ที่มีหลายหัว ที่ร้ายกาจที่สุดคือ เมื่อตัดหัวหนึ่งออก จะงอกหัวใหม่ขึ้นมาสองหัว',
 'เฮอร์คิวลีสได้รับภารกิจให้ปราบไฮดรา เขาให้หลานชายชื่อไอโอลัสใช้คบไฟจี้รอยตัดทันที หัวใหม่จึงงอกไม่ได้ จนปราบไฮดราได้สำเร็จ',
 'ไฮดราเป็นกลุ่มดาวที่ใหญ่ที่สุดใน 88 กลุ่ม ทอดตัวยาวเกือบหนึ่งในสี่ของท้องฟ้า',
 'ดาวดวงเด่นคืออัลฟาร์ด แปลว่า “ผู้โดดเดี่ยว” เพราะไม่มีดาวสว่างดวงอื่นอยู่ใกล้เลย']},
CANCER:{t:'ปูผู้กล้าหาญ',p:[
 'ระหว่างที่เฮอร์คิวลีสต่อสู้กับงูไฮดรา เทพีเฮราผู้ไม่ชอบเฮอร์คิวลีสได้ส่งปูยักษ์มาหนีบเท้าเขา',
 'เฮอร์คิวลีสเหยียบปูจนแหลก แต่เฮรายกย่องความกล้าหาญของปู จึงนำมันขึ้นไปไว้บนท้องฟ้า',
 'ดาวในกลุ่มปูค่อนข้างจาง แต่ตรงกลางมีกระจุกดาวรังผึ้ง ที่มองเห็นเป็นฝ้าจาง ๆ ด้วยตาเปล่าในที่ที่มืดสนิท']},
HERCULES:{t:'เฮอร์คิวลีส วีรบุรุษสิบสองภารกิจ',p:[
 'เฮอร์คิวลีสเป็นบุตรของซุส มีพละกำลังมหาศาลตั้งแต่ยังเป็นทารก',
 'เพื่อชดใช้ความผิดครั้งใหญ่ เขาต้องทำภารกิจที่แทบเป็นไปไม่ได้ถึงสิบสองอย่าง เช่น ปราบสิงโตแห่งนีเมีย ปราบงูไฮดรา และไปเอาแอปเปิลทองคำที่มีมังกรเฝ้า',
 'เมื่อเฮอร์คิวลีสสิ้นชีวิต ซุสนำเขาขึ้นไปอยู่บนท้องฟ้า สัตว์ร้ายที่เขาเคยปราบหลายตัวก็อยู่บนท้องฟ้าด้วย ทั้งสิงโต ไฮดรา ปู และมังกร',
 'บนท้องฟ้า เฮอร์คิวลีสอยู่ในท่าคุกเข่า มีดาวสี่ดวงเรียงเป็นสี่เหลี่ยมตรงลำตัว ใกล้ ๆ กันมีกระจุกดาวทรงกลมที่มีดาวหลายแสนดวงรวมกันอยู่']},
DRACO:{t:'มังกรเฝ้าแอปเปิลทองคำ',p:[
 'ในตำนานกรีก ลาดอนเป็นมังกรที่ไม่เคยหลับ คอยเฝ้าต้นแอปเปิลทองคำในสวนของเหล่านางไม้',
 'เฮอร์คิวลีสต้องไปนำแอปเปิลทองคำมาเป็นหนึ่งในสิบสองภารกิจ บางตำนานเล่าว่าเขาปราบมังกรตัวนี้',
 'เทพีเฮราจึงนำมังกรขึ้นไปไว้บนท้องฟ้า ลำตัวของมังกรขดเลื้อยอยู่ระหว่างหมีใหญ่กับหมีเล็ก',
 'เมื่อราวห้าพันปีก่อน ดาวทูแบนในกลุ่มดาวมังกรเคยเป็นดาวเหนือมาก่อน เพราะแกนโลกค่อย ๆ ส่ายไปตามกาลเวลา']},
OPH:{t:'หมอผู้ชุบชีวิตคนตาย',p:[
 'ในตำนานกรีก แอสคลีปิอุสเป็นบุตรของเทพอพอลโล ได้เรียนวิชาแพทย์จากไครอน คนครึ่งม้าผู้รอบรู้',
 'วันหนึ่งเขาเห็นงูตัวหนึ่งนำสมุนไพรมาชุบชีวิตงูอีกตัว แอสคลีปิอุสจึงเรียนรู้วิธีชุบชีวิตคนตาย',
 'เทพเฮดีสผู้ครองยมโลกไม่พอใจ เพราะไม่มีวิญญาณลงไปยมโลกอีก ซุสจึงใช้สายฟ้าฟาดแอสคลีปิอุส',
 'ภายหลังซุสยกย่องความดีของเขา จึงนำขึ้นไปเป็นกลุ่มดาวคนแบกงู โดยมีกลุ่มดาวงูอยู่ในมือ',
 'จนถึงทุกวันนี้ ไม้เท้าที่มีงูพันยังเป็นสัญลักษณ์ของการแพทย์']},
AURIGA:{t:'สารถีกับแม่แพะ',p:[
 'ในตำนานกรีก สารถีคือเอริกโธนิอัส กษัตริย์แห่งเอเธนส์ ผู้ประดิษฐ์รถม้าเทียมม้าสี่ตัว ซุสประทับใจจึงนำเขาขึ้นไปบนท้องฟ้า',
 'สารถีบนฟ้าอุ้มแม่แพะไว้ในอ้อมแขน ดาวคาเพลลาซึ่งแปลว่า “แพะตัวเมียน้อย” คือแม่แพะอามัลเธีย ที่เคยให้นมเลี้ยงซุสตอนเป็นทารก',
 'คาเพลลาเป็นดาวสีเหลืองคล้ายดวงอาทิตย์ สว่างเป็นอันดับหกของท้องฟ้ายามค่ำคืน']},
CENTAURUS:{t:'ไครอน คนครึ่งม้าผู้เป็นครู',p:[
 'คนครึ่งม้าส่วนใหญ่ในตำนานกรีกดุร้าย แต่ไครอนต่างออกไป เขาฉลาด ใจดี และรอบรู้ทั้งการแพทย์ ดนตรี และการยิงธนู',
 'ไครอนเป็นครูของวีรบุรุษหลายคน เช่น เฮอร์คิวลีส อคิลลีส และเจสัน',
 'วันหนึ่งไครอนถูกลูกศรอาบพิษไฮดราโดยไม่ตั้งใจ เขาเจ็บปวดแสนสาหัสแต่ไม่ตาย เพราะเป็นอมตะ',
 'ไครอนจึงยอมสละความเป็นอมตะ ซุสยกย่องในความดีของเขา และนำขึ้นไปเป็นกลุ่มดาวคนครึ่งม้า',
 'ที่เท้าของคนครึ่งม้าคือดาวแอลฟาเซนทอรี ระบบดาวที่อยู่ใกล้ระบบสุริยะที่สุด ห่างออกไปเพียงราว 4.4 ปีแสง']},
CRUX:{t:'กางเขนใต้ ดาวนำทางของซีกโลกใต้',p:[
 'กางเขนใต้เป็นกลุ่มดาวที่เล็กที่สุดใน 88 กลุ่ม แต่มีดาวสว่างสี่ดวงเรียงเป็นรูปไม้กางเขน',
 'นักเดินเรือในซีกโลกใต้ใช้กางเขนใต้หาทิศใต้ เพราะแกนยาวของกางเขนชี้ไปทางขั้วฟ้าใต้',
 'กลุ่มดาวนี้ปรากฏอยู่บนธงชาติของหลายประเทศ เช่น ออสเตรเลีย นิวซีแลนด์ และบราซิล',
 'ชาวอะบอริจินในออสเตรเลียมองบริเวณมืด ๆ ของทางช้างเผือกใกล้กางเขนใต้ ว่าเป็นหัวของนกอีมูยักษ์บนท้องฟ้า',
 'ในประเทศไทย ถ้ามองไปทางทิศใต้ในช่วงหัวค่ำเดือนมีนาคมถึงพฤษภาคม จะเห็นกางเขนใต้อยู่ต่ำ ๆ เหนือขอบฟ้า']},
AQR:{t:'แกนีมีด ผู้รินน้ำให้ทวยเทพ',p:[
 'ในตำนานกรีก แกนีมีดเป็นเด็กหนุ่มเลี้ยงแกะที่หน้าตางดงามที่สุด',
 'ซุสส่งนกอินทรีลงมารับเขาขึ้นไปบนเขาโอลิมปัส ให้เป็นผู้รินน้ำทิพย์ให้เหล่าเทพ',
 'บนท้องฟ้า แกนีมีดกำลังเทน้ำจากหม้อ สายน้ำไหลลงไปยังปากของกลุ่มดาวปลาใต้',
 'บริเวณนี้ของท้องฟ้ามีกลุ่มดาวที่เกี่ยวกับน้ำมากมาย ทั้งปลา วาฬ แพะทะเล และโลมา ชาวโบราณจึงเรียกย่านนี้ว่า “ทะเล”']},
CAP:{t:'แพน เทพครึ่งแพะครึ่งปลา',p:[
 'ในตำนานกรีก ครั้งหนึ่งยักษ์ไทฟอนผู้น่ากลัวบุกมาโจมตีเหล่าเทพ ทุกองค์ต่างแปลงกายเป็นสัตว์เพื่อหลบหนี',
 'เทพแพนผู้มีขาเป็นแพะกระโดดลงแม่น้ำอย่างรีบร้อน ร่างส่วนที่อยู่ใต้น้ำกลายเป็นหางปลา ส่วนที่อยู่เหนือน้ำยังเป็นแพะ',
 'ซุสเห็นว่าท่าทางนี้แปลกและน่ารัก จึงนำขึ้นไปไว้บนท้องฟ้าเป็นกลุ่มดาวแพะทะเล',
 'กลุ่มดาวนี้มีดาวไม่สว่างมาก เรียงกันเป็นรูปสามเหลี่ยมคล้ายเรือหรือรอยยิ้ม']},
PSC:{t:'ปลาสองตัวที่ผูกเชือกไว้ด้วยกัน',p:[
 'ในตำนานกรีก เทพีอะโฟรไดทีและบุตรชายชื่ออีรอสกำลังหนียักษ์ไทฟอน',
 'ทั้งคู่กระโดดลงแม่น้ำแล้วแปลงกายเป็นปลา และผูกเชือกเชื่อมกันไว้ เพื่อไม่ให้พลัดหลงจากกัน',
 'บนท้องฟ้าจึงเห็นปลาสองตัวว่ายอยู่คนละทาง โดยมีเส้นเชือกโยงถึงกัน',
 'กลุ่มดาวปลาเป็นกลุ่มดาวจักรราศีที่มีดาวจาง ต้องมองในที่มืดจึงเห็นได้ชัด']},
PSA:{t:'ปลาใต้ผู้ดื่มน้ำ',p:[
 'กลุ่มดาวปลาใต้เป็นปลาที่กำลังอ้าปากดื่มน้ำ ซึ่งไหลลงมาจากหม้อของกลุ่มดาวคนแบกหม้อน้ำ',
 'ที่ปากของปลาคือดาวโฟมัลฮอต ชื่อนี้แปลว่า “ปากปลา”',
 'โฟมัลฮอตเป็นดาวสว่างที่อยู่โดดเดี่ยวบนฟ้าทิศใต้ ช่วงหัวค่ำเดือนกันยายนถึงพฤศจิกายนจึงหาได้ง่าย']},
LIBRA:{t:'ตาชั่งแห่งความยุติธรรม',p:[
 'กลุ่มดาวคันชั่งถูกมองว่าเป็นตาชั่งของเทพีแห่งความยุติธรรม ซึ่งอยู่ข้างกลุ่มดาวหญิงสาว',
 'ในสมัยโบราณ ดาวกลุ่มนี้เคยถูกมองว่าเป็นก้ามของแมงป่อง ชื่อดาวบางดวงในภาษาอาหรับจึงยังแปลว่า “ก้ามด้านใต้” และ “ก้ามด้านเหนือ”',
 'คันชั่งเป็นกลุ่มดาวจักรราศีเพียงกลุ่มเดียวที่เป็นสิ่งของ ไม่ใช่คนหรือสัตว์']},
DELPHINUS:{t:'โลมาผู้เป็นแม่สื่อ',p:[
 'ในตำนานกรีก เทพโพไซดอนหลงรักนางไม้แห่งท้องทะเลชื่ออัมฟิไทรที แต่นางขี้อายและหนีไปซ่อนตัว',
 'โลมาตัวหนึ่งว่ายน้ำตามหาจนพบนาง และพูดโน้มน้าวให้นางกลับมาแต่งงานกับโพไซดอน',
 'โพไซดอนขอบคุณโลมามาก จึงนำมันขึ้นไปไว้บนท้องฟ้า',
 'กลุ่มดาวโลมาเล็กน่ารัก มีดาวสี่ดวงเรียงเป็นรูปสี่เหลี่ยมเล็ก ๆ เหมือนตัวโลมา และมีหางยื่นออกไป']},
LEPUS:{t:'กระต่ายใต้เท้านายพราน',p:[
 'กลุ่มดาวกระต่ายอยู่ใต้เท้าของนายพรานโอไรออนพอดี ชาวกรีกมองว่าเป็นกระต่ายที่นายพรานกำลังไล่ล่า',
 'ข้าง ๆ กันมีสุนัขใหญ่ของนายพรานคอยไล่ตามอยู่ กระต่ายตัวนี้จึงต้องวิ่งหนีอยู่บนท้องฟ้าทุกคืน']},
ERIDANUS:{t:'แม่น้ำบนท้องฟ้า',p:[
 'กลุ่มดาวแม่น้ำคือแม่น้ำอีริดานัส ที่ฟีทอนตกลงไปหลังจากขับรถม้าเทียมดวงอาทิตย์จนควบคุมไม่ได้',
 'แม่น้ำสายนี้คดเคี้ยวยาวมาก เริ่มจากใกล้เท้านายพรานไหลลงไปจนถึงฟ้าซีกใต้',
 'ปลายแม่น้ำคือดาวอเคอร์นาร์ ชื่อนี้แปลว่า “ปลายแม่น้ำ”']},
CROW:{t:'อีกากับถ้วยน้ำ',p:[
 'ในตำนานกรีก เทพอพอลโลส่งอีกาให้นำถ้วยไปตักน้ำ',
 'ระหว่างทางอีกาเห็นต้นมะเดื่อ จึงแวะรอให้ผลสุกแล้วกินจนอิ่ม กว่าจะนึกได้ก็สายมาก',
 'อีกาจึงจับงูน้ำมาตัวหนึ่ง แล้วโกหกอพอลโลว่างูตัวนี้ขวางทางน้ำไว้',
 'อพอลโลรู้ทันจึงลงโทษ นำอีกา ถ้วย และงูขึ้นไปไว้บนท้องฟ้า โดยให้งูไฮดราคั่นไว้ อีกาจึงไม่มีวันได้ดื่มน้ำจากถ้วยนั้นอีกเลย']},
SAGITTA:{t:'ลูกศรของเฮอร์คิวลีส',p:[
 'ในตำนานกรีก โพรมีธีอุสขโมยไฟจากสวรรค์มาให้มนุษย์ ซุสจึงลงโทษโดยล่ามเขาไว้กับภูเขา และส่งนกอินทรีมาจิกกินตับทุกวัน',
 'เฮอร์คิวลีสผ่านมาเห็น จึงยิงลูกศรสังหารนกอินทรี และปลดปล่อยโพรมีธีอุส',
 'ลูกศรดอกนั้นถูกนำขึ้นไปไว้บนท้องฟ้า เป็นกลุ่มดาวเล็ก ๆ ที่อยู่ใกล้กลุ่มดาวนกอินทรี']},
CRB:{t:'มงกุฎของเจ้าหญิงอาริแอดนี',p:[
 'ในตำนานกรีก เจ้าหญิงอาริแอดนีช่วยธีซีอุสหาทางออกจากเขาวงกตของมิโนทอร์ ด้วยการให้ม้วนด้ายไว้คลายตามทาง',
 'แต่ภายหลังธีซีอุสกลับทิ้งนางไว้บนเกาะนักซอส',
 'เทพไดโอนีซัสพบอาริแอดนีและแต่งงานกับนาง โดยมอบมงกุฎประดับอัญมณีให้เป็นของขวัญ',
 'ต่อมามงกุฎถูกโยนขึ้นไปบนท้องฟ้า อัญมณีกลายเป็นดาวที่เรียงเป็นรูปครึ่งวงกลมสวยงาม']},
COMA:{t:'ผมของพระราชินีเบเรนิซ',p:[
 'กลุ่มดาวนี้มาจากเรื่องจริงในอียิปต์โบราณ พระราชินีเบเรนิซสัญญากับเทพว่า หากพระสวามีกลับจากสงครามอย่างปลอดภัย พระนางจะตัดผมยาวสลวยถวาย',
 'เมื่อพระราชากลับมา พระนางก็ตัดผมถวายไว้ในวิหาร แต่วันรุ่งขึ้นผมนั้นกลับหายไป',
 'นักดาราศาสตร์ประจำราชสำนักจึงทูลว่า เทพพอใจมาก จึงนำผมของพระนางขึ้นไปไว้บนท้องฟ้าแล้ว',
 'กลุ่มดาวนี้เป็นกระจุกดาวจาง ๆ คล้ายเส้นผมที่ระยิบระยับ']},
ARA:{t:'แท่นบูชาของเหล่าเทพ',p:[
 'ในตำนานกรีก ก่อนสงครามครั้งใหญ่ระหว่างเหล่าเทพโอลิมปัสกับพวกไททัน เทพทั้งหลายมาร่วมสาบานความจงรักภักดีกันที่แท่นบูชานี้',
 'เมื่อชนะสงคราม ซุสจึงนำแท่นบูชาขึ้นไปไว้บนท้องฟ้า','กลุ่มดาวนี้อยู่ทางทิศใต้ ใต้หางของแมงป่อง']},
COLUMBA:{t:'นกพิราบของโนอาห์',p:[
 'กลุ่มดาวนกพิราบตั้งชื่อขึ้นเมื่อราวปี ค.ศ. 1600 โดยนักทำแผนที่ชาวดัตช์',
 'นกพิราบตัวนี้มาจากเรื่องเรือของโนอาห์ ที่ปล่อยนกพิราบออกไปหาแผ่นดินหลังน้ำท่วมโลก นกบินกลับมาพร้อมกิ่งมะกอก เป็นสัญญาณว่าน้ำเริ่มลดแล้ว',
 'กลุ่มดาวนี้อยู่ใกล้กลุ่มดาวกระต่าย ใต้เท้านายพราน']},
LUPUS:{t:'หมาป่า',p:['กลุ่มดาวหมาป่าเป็นหนึ่งในกลุ่มดาวโบราณ อยู่ติดกับกลุ่มดาวคนครึ่งม้า','ชาวกรีกโบราณมองว่าเป็นสัตว์ป่าที่คนครึ่งม้ากำลังถืออยู่','กลุ่มดาวนี้อยู่บนแนวทางช้างเผือก ใกล้กับกลุ่มดาวแมงป่อง']},
DUTCH:{t:'กลุ่มดาวของนักเดินเรือ',p:[
 'กลุ่มดาวนี้ตั้งชื่อขึ้นใหม่เมื่อราวปี ค.ศ. 1600 จากการสังเกตของนักเดินเรือชาวดัตช์ที่ล่องเรือไปยังหมู่เกาะอินเดียตะวันออก ซึ่งก็คืออินโดนีเซียในปัจจุบัน',
 'ชาวยุโรปไม่เคยเห็นท้องฟ้าซีกใต้มาก่อน จึงตั้งชื่อตามสัตว์แปลกตาที่พบระหว่างการเดินทาง เช่น นกยูง นกทูแคน นกกระเรียน และปลาบิน',
 'กลุ่มดาวนี้จึงยังไม่มีตำนานโบราณ แต่มีเรื่องราวของการผจญภัยในทะเล']},
LACAILLE:{t:'กลุ่มดาวเครื่องมือวิทยาศาสตร์',p:[
 'นิโกลา-หลุยส์ เดอ ลากาย นักดาราศาสตร์ชาวฝรั่งเศส ตั้งชื่อกลุ่มดาวนี้เมื่อราวปี ค.ศ. 1750 ระหว่างไปสังเกตดาวที่แหลมกู๊ดโฮปในแอฟริกาใต้',
 'เขาทำแผนที่ดาวในฟ้าซีกใต้ได้นับหมื่นดวง และนิยมตั้งชื่อกลุ่มดาวใหม่ตามเครื่องมือวิทยาศาสตร์และศิลปะ เช่น กล้องโทรทรรศน์ กล้องจุลทรรศน์ นาฬิกา และเครื่องสูบลม',
 'กลุ่มดาวเหล่านี้จึงเป็นเหมือนอนุสรณ์ของยุคแห่งการค้นพบทางวิทยาศาสตร์']},
HEVELIUS:{t:'กลุ่มดาวเติมช่องว่าง',p:[
 'โยฮันเนส เฮเวลิอุส นักดาราศาสตร์ชาวโปแลนด์ ตั้งชื่อกลุ่มดาวนี้ในหนังสือแผนที่ดาวที่ตีพิมพ์ในปี ค.ศ. 1690',
 'เขาต้องการเติมช่องว่างระหว่างกลุ่มดาวโบราณ ดาวส่วนใหญ่ในกลุ่มเหล่านี้จึงค่อนข้างจาง',
 'มีเกร็ดว่า เฮเวลิอุสตั้งชื่อกลุ่มดาวแมวป่า เพราะต้องมีสายตาแหลมคมเหมือนแมวป่าถึงจะมองเห็นได้']},
ANCIENT:{t:'กลุ่มดาวโบราณ',p:[
 'กลุ่มดาวนี้เป็นหนึ่งใน 48 กลุ่มดาวโบราณ ที่นักดาราศาสตร์ชื่อปโตเลมีบันทึกไว้เมื่อเกือบสองพันปีก่อน',
 'ผู้คนในสมัยนั้นใช้ดาวบอกเวลา ฤดูกาล และทิศทาง ก่อนจะมีนาฬิกาและเข็มทิศ']},
GENERIC:{t:'หนึ่งใน 88 กลุ่มดาวสากล',p:[
 'ท้องฟ้าทั้งหมดถูกแบ่งออกเป็น 88 กลุ่มดาว โดยสหพันธ์ดาราศาสตร์สากล เหมือนการแบ่งแผนที่โลกเป็นประเทศ',
 'ทุกจุดบนท้องฟ้าจึงอยู่ในกลุ่มดาวใดกลุ่มดาวหนึ่งเสมอ']}
};

const BODIES=[['Sun','ดวงอาทิตย์','#ffd34d',11],['Moon','ดวงจันทร์','#f3efdc',10],['Mercury','ดาวพุธ','#d8c8b4',3.5],['Venus','ดาวศุกร์','#fff4c2',5],['Mars','ดาวอังคาร','#ff8a5c',4.2],['Jupiter','ดาวพฤหัสบดี','#f2d7a7',5],['Saturn','ดาวเสาร์','#e8d08f',4.5],['Uranus','ดาวยูเรนัส','#a8e6ef',3],['Neptune','ดาวเนปจูน','#8fb2ff',3]];
const COMPASS=['เหนือ','ตะวันออกเฉียงเหนือ','ตะวันออก','ตะวันออกเฉียงใต้','ใต้','ตะวันตกเฉียงใต้','ตะวันตก','ตะวันตกเฉียงเหนือ'];
const CARD=[['N',0,'เหนือ'],['NE',45],['E',90,'ตะวันออก'],['SE',135],['S',180,'ใต้'],['SW',225],['W',270,'ตะวันตก'],['NW',315]];
const conTh=id=>CON_TH[id]||(CON_INFO[id]?CON_INFO[id][0]:id);
const starLabel=name=>STAR_TH[name]?`${STAR_TH[name]}`:name;

// ---------------- สถานะ ----------------
const st={lat:13.7563,lon:100.5018,gps:false,timeOffsetMin:0,vfov:62,
  sensorOn:false,lastSensor:0,gotAbs:false,kind:'',iosOff:null,iosGood:false,calib:0,
  manAz:135,manAlt:35,grid:false,cam:false,target:''};
try{const s=JSON.parse(localStorage.getItem('sf_loc')||'null');if(s&&isFinite(s.lat)){st.lat=s.lat;st.lon=s.lon}}catch(e){}
let observer=new A.Observer(st.lat,st.lon,0);
const now=()=>new Date(Date.now()+st.timeOffsetMin*60000);

// ---------------- เตรียมเวกเตอร์ J2000 ----------------
function eqj(raDeg,decDeg){const r=raDeg*D2R,d=decDeg*D2R,c=Math.cos(d);return [c*Math.cos(r),c*Math.sin(r),Math.sin(d)]}
const NS=STARS.length;
const starEQ=new Float64Array(NS*3);STARS.forEach((s,i)=>{const v=eqj(s[0],s[1]);starEQ.set(v,i*3)});
const starCol=STARS.map(s=>{const b=s[3];return b<0?'#b4ceff':b<0.35?'#e6eeff':b<0.7?'#fff7e6':b<1.15?'#ffe3b5':'#ffc890'});
const conIds=Object.keys(CON_LINES);
const linesEQ=conIds.map(id=>CON_LINES[id].map(l=>l.map(p=>eqj(p[0],p[1]))));
const mwKeys=['ol1','ol2','ol3'];
const mwEQ=mwKeys.map(k=>(MILKYWAY[k]||[]).map(poly=>poly.map(p=>eqj(p[0],p[1]))));
const lblIds=Object.keys(CON_INFO);
const lblEQ=lblIds.map(id=>eqj(CON_INFO[id][1],CON_INFO[id][2]));
const brightStars=[];for(const k in STAR_NAMES){const i=+k;if(STARS[i][2]<1.6||STAR_NAMES[k]==='Polaris')brightStars.push(i)}
// เส้นกริด (แนวราบ)
const grid=[];
for(const alt of [0,30,60]){const l=[];for(let az=0;az<=360;az+=5)l.push(enuFromAzAlt(az,alt));grid.push(l)}
for(let az=0;az<360;az+=30){const l=[];for(let alt=-10;alt<=88;alt+=4)l.push(enuFromAzAlt(az,alt));grid.push(l)}
function enuFromAzAlt(az,alt){const a=az*D2R,h=alt*D2R;return [Math.cos(h)*Math.sin(a),Math.cos(h)*Math.cos(a),Math.sin(h)]}
function azAltFromEnu(v){return {az:wrap360(Math.atan2(v[0],v[1])*R2D),alt:Math.asin(Math.max(-1,Math.min(1,v[2])))*R2D}}

// ---------------- คำนวณตำแหน่งบนท้องฟ้า (Astronomy Engine) ----------------
let sky={},lastSky=0,skyDirty=true;
function eqjToEnu(m,v,out,o,refr){
  const x=m[0][0]*v[0]+m[1][0]*v[1]+m[2][0]*v[2];   // ทิศเหนือ
  const y=m[0][1]*v[0]+m[1][1]*v[1]+m[2][1]*v[2];   // ทิศตะวันตก
  let z=m[0][2]*v[0]+m[1][2]*v[1]+m[2][2]*v[2];     // จุดเหนือศีรษะ
  let e=-y,n=x;
  if(refr&&z>-0.03){const alt=Math.asin(z)*R2D,alt2=alt+A.Refraction('normal',alt),h=Math.hypot(e,n);if(h>1e-9){const k=Math.cos(alt2*D2R)/h;e*=k;n*=k}z=Math.sin(alt2*D2R)}
  out[o]=e;out[o+1]=n;out[o+2]=z;
}
function computeSky(){
  const t=A.MakeTime(now());
  const rot=A.Rotation_EQJ_HOR(t,observer).rot;
  const stars=new Float64Array(NS*3);
  for(let i=0;i<NS;i++)eqjToEnu(rot,starEQ.subarray(i*3,i*3+3),stars,i*3,true);
  const lines=linesEQ.map(con=>con.map(l=>{const a=new Float64Array(l.length*3);l.forEach((v,j)=>eqjToEnu(rot,v,a,j*3,true));return a}));
  const mw=mwEQ.map(layer=>layer.map(poly=>{const a=new Float64Array(poly.length*3);poly.forEach((v,j)=>eqjToEnu(rot,v,a,j*3,false));return a}));
  const lbl=new Float64Array(lblIds.length*3);lblEQ.forEach((v,i)=>eqjToEnu(rot,v,lbl,i*3,false));
  const bodies=BODIES.map(([name,th,col,r])=>{
    const b=A.Body[name];
    const eq=A.Equator(b,t,observer,true,true);
    const hor=A.Horizon(t,observer,eq.ra,eq.dec,'normal');
    let mag=null;try{if(name!=='Sun')mag=A.Illumination(b,t).mag}catch(e){}
    return {name,th,col,r,az:hor.azimuth,alt:hor.altitude,v:enuFromAzAlt(hor.azimuth,hor.altitude),mag};
  });
  const sun=bodies[0];
  sky={t,rot,horEqj:A.Rotation_HOR_EQJ(t,observer).rot,stars,lines,mw,lbl,bodies,sunAlt:sun.alt,moonPhase:A.MoonPhase(t)};
  lastSky=Date.now();skyDirty=false;riseCache={};
}

// ---------------- เซนเซอร์ → เมทริกซ์มุมมอง ----------------
// เมทริกซ์ R (อุปกรณ์ → ENU) ตามนิยาม W3C: R = Rz(alpha)·Rx(beta)·Ry(gamma)
function euler(a,b,g){
  a*=D2R;b*=D2R;g*=D2R;
  const cA=Math.cos(a),sA=Math.sin(a),cB=Math.cos(b),sB=Math.sin(b),cG=Math.cos(g),sG=Math.sin(g);
  return [[cA*cG-sA*sB*sG,-sA*cB,cA*sG+sA*sB*cG],
          [sA*cG+cA*sB*sG, cA*cB,sA*sG-cA*sB*cG],
          [-cB*sG,         sB,   cB*cG]];
}
const col=(m,j)=>[m[0][j],m[1][j],m[2][j]];
function screenAngle(){let a=0;if(screen.orientation&&typeof screen.orientation.angle==='number')a=screen.orientation.angle;else if(typeof window.orientation==='number')a=window.orientation;return a||0}
// มุมมองปัจจุบัน: r = ขวาจอ, u = บนจอ, f = ทิศที่กล้องหลังชี้ (ทั้งหมดในพิกัด ENU)
let view={r:[1,0,0],u:[0,0,1],f:[0,1,0]},target=null;
function setTargetFromMatrix(m){
  const th=screenAngle()*D2R,c=Math.cos(th),s=Math.sin(th);
  const X=col(m,0),Y=col(m,1),Z=col(m,2);
  const r=[0,1,2].map(i=>X[i]*c-Y[i]*s), u=[0,1,2].map(i=>X[i]*s+Y[i]*c), f=Z.map(v=>-v);
  target={r:rotUp(r,st.calib),u:rotUp(u,st.calib),f:rotUp(f,st.calib)};
}
function rotUp(v,d){ // หมุนรอบแกนตั้ง ให้ทิศ (azimuth) เพิ่มขึ้น d องศา
  const a=d*D2R,c=Math.cos(a),s=Math.sin(a);return [v[0]*c+v[1]*s,-v[0]*s+v[1]*c,v[2]];
}
function manualTarget(){
  const f=enuFromAzAlt(st.manAz,st.manAlt),a=st.manAz*D2R,r=[Math.cos(a),-Math.sin(a),0];
  target={r,u:cross(r,f),f};
}
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
function onOrient(e,isAbs){
  if(!st.sensorOn||e.beta==null)return;
  let a=e.alpha||0;const b=e.beta,g=e.gamma||0;
  const ch=e.webkitCompassHeading;
  if(typeof ch==='number'&&ch>=0&&!isNaN(ch)){ // iPhone: alpha ไม่ได้อ้างอิงทิศเหนือ → ใช้ webkitCompassHeading หาค่าชดเชย
    st.kind='ios';
    const portrait=screenAngle()===0;
    let sample=null,good=false;
    if(portrait&&Math.abs(b)<70&&Math.abs(g)<30){sample=wrap180((360-ch)-a);good=true}           // ทิศขอบบนเครื่อง = -alpha
    else if(!st.iosGood){const m=euler(a,b,g),fh=Math.atan2(-m[0][2],-m[1][2])*R2D;sample=wrap180(ch-fh)*-1} // ชั่วคราว: ถือว่าเป็นทิศกล้อง
    if(sample!==null){
      if(st.iosOff===null||(good&&!st.iosGood))st.iosOff=sample;
      else st.iosOff=wrap180(st.iosOff+wrap180(sample-st.iosOff)*(good?0.08:0.03));
      if(good)st.iosGood=true;
    }
    if(st.iosOff===null)return;
    a=a+st.iosOff;
  }else if(isAbs||e.absolute===true){st.kind='abs';if(isAbs)st.gotAbs=true;else if(st.gotAbs)return}
  else{if(st.gotAbs)return;st.kind='rel'}
  st.lastSensor=Date.now();
  setTargetFromMatrix(euler(a,b,g));
}
const sensorLive=()=>st.sensorOn&&Date.now()-st.lastSensor<1500;
function attachSensors(){
  if('ondeviceorientationabsolute' in window)window.addEventListener('deviceorientationabsolute',e=>onOrient(e,true),true);
  window.addEventListener('deviceorientation',e=>onOrient(e,false),true);
  st.sensorOn=true;$('sensorBtn').classList.add('on');
  setTimeout(()=>{if(!st.lastSensor)setStatus('ไม่ได้รับข้อมูลจากเซนเซอร์ — ใช้นิ้วลากเพื่อหมุนท้องฟ้าแทน (ถ้าเป็น iPhone ให้ปิดแล้วเปิดหน้าใหม่ แล้วกด “อนุญาต”)',true)},3000);
}
function updateView(){
  if(!sensorLive())manualTarget();
  if(!target)manualTarget();
  const k=sensorLive()?0.22:0.5;
  let f=norm(view.f.map((v,i)=>v+(target.f[i]-v)*k));
  let u=view.u.map((v,i)=>v+(target.u[i]-v)*k);
  if(dot(view.f,target.f)<0.2){f=target.f.slice();u=target.u.slice()} // กระโดดเมื่อห่างมาก
  const d=dot(u,f);u=norm(u.map((v,i)=>v-d*f[i]));
  view={f,u,r:cross(f,u)};
}

// ---------------- วาด ----------------
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}
let F=1,cx=0,cy=0,hits=[];
function proj(v,o){ // คืนค่า [x,y] หรือ null ถ้าอยู่ด้านหลัง
  o=o||0;const x=v[o],y=v[o+1],z=v[o+2];
  const df=view.f[0]*x+view.f[1]*y+view.f[2]*z;if(df<0.02)return null;
  return [cx+F*(view.r[0]*x+view.r[1]*y+view.r[2]*z)/df, cy-F*(view.u[0]*x+view.u[1]*y+view.u[2]*z)/df];
}
function polyline(arr){ // arr = Float64Array xyz
  let started=false;ctx.beginPath();
  for(let j=0;j<arr.length;j+=3){const p=proj(arr,j);if(!p){started=false;continue}if(!started){ctx.moveTo(p[0],p[1]);started=true}else ctx.lineTo(p[0],p[1])}
  ctx.stroke();
}
function polylineArr(list){let s=false;ctx.beginPath();for(const v of list){const p=proj(v);if(!p){s=false;continue}if(!s){ctx.moveTo(p[0],p[1]);s=true}else ctx.lineTo(p[0],p[1])}ctx.stroke()}
function fillPolyClipped(arr){ // ตัดรูปหลายเหลี่ยมด้วยระนาบด้านหน้ากล้องก่อนฉาย (กันภาพเพี้ยน)
  const n=arr.length/3,pts=[];
  for(let j=0;j<n;j++){const x=arr[j*3],y=arr[j*3+1],z=arr[j*3+2];pts.push([dot(view.r,[x,y,z]),dot(view.u,[x,y,z]),dot(view.f,[x,y,z])])}
  const out=[],E=0.05;
  for(let j=0;j<n;j++){const a=pts[j],b=pts[(j+1)%n],ia=a[2]>=E,ib=b[2]>=E;if(ia)out.push(a);if(ia!==ib){const t=(E-a[2])/(b[2]-a[2]);out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,E])}}
  if(out.length<3)return;
  ctx.beginPath();out.forEach((p,i)=>{const x=cx+F*p[0]/p[2],y=cy-F*p[1]/p[2];i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fill();
}
let curCon='',centerInfo=null;
function render(){
  const night=redLevel()?1:Math.max(0,Math.min(1,(-sky.sunAlt-0)/12)); // 0=กลางวัน 1=กลางคืน (โหมดแดง = ฟ้ามืดเสมอ)
  F=(H/2)/Math.tan(st.vfov/2*D2R);cx=W/2;cy=H/2;hits=[];
  ctx.clearRect(0,0,W,H);
  if(!st.cam){
    const g=ctx.createLinearGradient(0,0,0,H);
    const top=mix([33,86,150],[4,10,24],night),bot=mix([110,165,220],[12,26,48],night);
    g.addColorStop(0,`rgb(${top})`);g.addColorStop(1,`rgb(${bot})`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  const vis=st.cam?0.9:0.35+0.65*night;
  // ทางช้างเผือก
  const mwVis=st.cam?0.6:night;
  if(mwVis>0.05)[0.035,0.045,0.06].forEach((a,i)=>{ctx.fillStyle=`rgba(175,200,255,${a*mwVis})`;for(const p of sky.mw[i])fillPolyClipped(p)});
  // กริด
  if(st.grid){ctx.strokeStyle='rgba(124,200,255,.18)';ctx.lineWidth=1;grid.forEach(polylineArr)}
  // เส้นกลุ่มดาว
  ctx.lineWidth=1;ctx.strokeStyle=`rgba(110,180,255,${0.32*vis+0.1})`;
  conIds.forEach((id,i)=>{if(id!==curCon)sky.lines[i].forEach(polyline)});
  const ci=conIds.indexOf(curCon);
  if(ci>=0){ctx.lineWidth=2;ctx.strokeStyle='rgba(140,210,255,.95)';sky.lines[ci].forEach(polyline)}
  // ชื่อกลุ่มดาว
  ctx.textAlign='center';ctx.textBaseline='middle';
  lblIds.forEach((id,i)=>{
    const isCur=id===curCon;if(!isCur&&CON_INFO[id][3]>2)return;
    const p=proj(sky.lbl,i*3);if(!p||p[0]<-50||p[0]>W+50||p[1]<-20||p[1]>H+20)return;
    ctx.font=isCur?'600 15px system-ui':'12px system-ui';ctx.fillStyle=isCur?'rgba(150,215,255,1)':'rgba(120,175,235,.75)';
    ctx.fillText(conTh(id),p[0],p[1]);hits.push({x:p[0],y:p[1],type:'con',id,pri:1});
  });
  // ดาวฤกษ์
  const magLim=st.vfov>70?4.3:st.vfov>45?4.8:5.2;
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  for(let i=0;i<NS;i++){
    const m=STARS[i][2];if(m>magLim)break;
    const p=proj(sky.stars,i*3);if(!p||p[0]<-10||p[0]>W+10||p[1]<-10||p[1]>H+10)continue;
    const r=Math.max(0.55,(5.6-m)*0.72)*(st.vfov<40?1.25:1);
    if(m<1.6){ctx.fillStyle='rgba(190,220,255,.16)';ctx.beginPath();ctx.arc(p[0],p[1],r*2.6,0,6.283);ctx.fill()}
    ctx.globalAlpha=Math.min(1,0.35+(magLim-m)*0.3);ctx.fillStyle=starCol[i];ctx.beginPath();ctx.arc(p[0],p[1],r,0,6.283);ctx.fill();ctx.globalAlpha=1;
    const nm=STAR_NAMES[i];
    if(nm){hits.push({x:p[0],y:p[1],type:'star',i,name:nm});if(m<1.6||st.vfov<45){ctx.font='12px system-ui';ctx.fillStyle='rgba(255,240,205,.92)';ctx.fillText(starLabel(nm),p[0]+r+4,p[1]-r-2)}}
  }
  // ดาวเคราะห์/ดวงอาทิตย์/ดวงจันทร์
  for(const b of sky.bodies){
    const p=proj(b.v);if(!p)continue;
    if(b.name==='Sun'){ctx.fillStyle='rgba(255,210,80,.25)';ctx.beginPath();ctx.arc(p[0],p[1],b.r*2.2,0,6.283);ctx.fill()}
    ctx.fillStyle=b.col;ctx.beginPath();ctx.arc(p[0],p[1],b.r,0,6.283);ctx.fill();
    if(b.name==='Moon')drawMoonShade(p,b.r);
    ctx.font='600 13px system-ui';ctx.fillStyle=b.col;ctx.fillText(b.th,p[0]+b.r+5,p[1]+4);
    hits.push({x:p[0],y:p[1],type:'body',b});
  }
  drawGround();
  drawTarget();
}
function drawMoonShade(p,r){ // เงาเฟสดวงจันทร์แบบง่าย
  const ph=sky.moonPhase*D2R,k=Math.cos(ph); // 1=ข้างแรม/เดือนมืด
  ctx.save();ctx.beginPath();ctx.arc(p[0],p[1],r,0,6.283);ctx.clip();ctx.fillStyle='rgba(20,24,34,.85)';
  ctx.beginPath();const waxing=sky.moonPhase<180;
  ctx.arc(p[0],p[1],r,Math.PI/2,-Math.PI/2,!waxing);ctx.ellipse(p[0],p[1],Math.abs(k)*r,r,0,-Math.PI/2,Math.PI/2,(k>0)!==waxing?false:true);ctx.fill();ctx.restore();
}
function mix(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(',')}
function drawGround(){
  // จุดบนจอที่ "รังสีมอง" ชี้ต่ำกว่าขอบฟ้า เป็นอสมการเชิงเส้นของ (x,y) → ตัดสี่เหลี่ยมจอด้วยครึ่งระนาบ
  const Ux=view.r[2],Uy=view.u[2],Uz=view.f[2];
  const val=(x,y)=>((x-cx)/F)*Ux-((y-cy)/F)*Uy+Uz; // >0 = เหนือขอบฟ้า
  const rect=[[0,0],[W,0],[W,H],[0,H]],poly=[];
  for(let i=0;i<4;i++){const a=rect[i],b=rect[(i+1)%4],va=val(a[0],a[1]),vb=val(b[0],b[1]);if(va<=0)poly.push(a);if((va<=0)!==(vb<=0)){const t=va/(va-vb);poly.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t])}}
  if(poly.length>=3){ctx.fillStyle=st.cam?'rgba(10,22,14,.35)':'rgba(9,17,13,.93)';ctx.beginPath();poly.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fill()}
  // เส้นขอบฟ้า + ทิศ
  ctx.strokeStyle='rgba(124,200,255,.7)';ctx.lineWidth=1.3;polylineArr(grid[0]);
  ctx.textAlign='center';
  for(const c of CARD){const p=proj(enuFromAzAlt(c[1],0));if(!p||p[0]<-40||p[0]>W+40)continue;
    ctx.fillStyle='rgba(124,200,255,.95)';ctx.fillRect(p[0]-.75,p[1]-8,1.5,8);
    ctx.font=c[2]?'700 14px system-ui':'600 12px system-ui';ctx.fillText(c[0],p[0],p[1]-13);
    if(c[2]){ctx.font='11px system-ui';ctx.fillStyle='rgba(160,200,240,.85)';ctx.fillText(c[2],p[0],p[1]+15)}}
  ctx.textAlign='left';
}

// ---------------- เป้าหมาย / นำทาง ----------------
function targetVec(){
  const t=st.target;if(!t)return null;const [k,id]=t.split(':');
  if(k==='b'){const b=sky.bodies.find(x=>x.name===id);return b?{v:b.v,name:b.th}:null}
  if(k==='s'){const i=+id;return {v:Array.from(sky.stars.subarray(i*3,i*3+3)),name:starLabel(STAR_NAMES[i])}}
  if(k==='c'){const i=lblIds.indexOf(id);return {v:Array.from(sky.lbl.subarray(i*3,i*3+3)),name:'กลุ่มดาว'+conTh(id)}}
  return null;
}
function drawTarget(){
  const tv=targetVec();if(!tv)return;
  const p=proj(tv.v);const m=40;
  if(p&&p[0]>m&&p[0]<W-m&&p[1]>m&&p[1]<H-m){
    const pulse=1+0.15*Math.sin(Date.now()/250);
    ctx.strokeStyle='#ffd98a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p[0],p[1],18*pulse,0,6.283);ctx.stroke();
  }else{
    // ลูกศรชี้ไปยังเป้าหมายที่ขอบจอ
    const dx=dot(view.r,tv.v),dy=dot(view.u,tv.v),ang=Math.atan2(-dy,dx);
    const R=Math.min(W,H)/2-36,x=cx+Math.cos(ang)*R,y=cy+Math.sin(ang)*R;
    ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.fillStyle='#ffd98a';ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-8,-11);ctx.lineTo(-3,0);ctx.lineTo(-8,11);ctx.closePath();ctx.fill();ctx.restore();
  }
}
let riseCache={};
function nextRise(v0key){ // หาเวลาที่เป้าหมายจะขึ้นเหนือขอบฟ้า ภายใน 24 ชม. (ไล่ทีละ 10 นาที)
  if(riseCache[v0key]!==undefined)return riseCache[v0key];
  const [k,id]=v0key.split(':');let eq=null;
  if(k==='s')eq=starEQ.subarray(+id*3,+id*3+3);
  else if(k==='c')eq=lblEQ[lblIds.indexOf(id)];
  const base=now().getTime();let res=null;
  for(let m=10;m<=1440;m+=10){
    const t=A.MakeTime(new Date(base+m*60000));let alt;
    if(k==='b'){const e=A.Equator(A.Body[id],t,observer,true,true);alt=A.Horizon(t,observer,e.ra,e.dec,'normal').altitude}
    else{const o=[0,0,0];eqjToEnu(A.Rotation_EQJ_HOR(t,observer).rot,eq,o,0,true);alt=Math.asin(o[2])*R2D}
    if(alt>0){res=new Date(base+m*60000);break}
  }
  return riseCache[v0key]=res;
}
function updateGuide(c){
  const g=$('guide'),tv=targetVec();
  if(!tv){g.style.display='none';return}
  g.style.display='block';
  const t=azAltFromEnu(tv.v),dAz=wrap180(t.az-c.az),dAlt=t.alt-c.alt;
  const pos=`<small>ตำแหน่งจริง: Azimuth ${t.az.toFixed(1)}° · Altitude ${t.alt.toFixed(1)}°</small>`;
  let below='';
  if(t.alt<0){const r=nextRise(st.target);below=`<small style="color:#ffb38a">⬇ ตอนนี้อยู่ใต้ขอบฟ้า${r?` · จะขึ้นราว ${r.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})} น.`:''}</small>`}
  if(Math.abs(dAz)<4&&Math.abs(dAlt)<4){g.className='found';g.innerHTML=`🎯 เจอแล้ว! <b>${tv.name}</b> อยู่กลางจอ${pos}${below}`;return}
  g.className='';
  const h=Math.abs(dAz)<2?'':(dAz>0?`หันขวา ${Math.round(Math.abs(dAz))}° ➡️`:`⬅️ หันซ้าย ${Math.round(Math.abs(dAz))}°`);
  const v=Math.abs(dAlt)<2?'':(dAlt>0?`เงยขึ้น ${Math.round(dAlt)}° ⬆️`:`ก้มลง ${Math.round(-dAlt)}° ⬇️`);
  g.innerHTML=`${[h,v].filter(Boolean).join(' · ')} → <b>${tv.name}</b>${pos}${below}`;
}
function buildTargetList(){
  const sel=$('target');
  const og=(label,items)=>{const g=document.createElement('optgroup');g.label=label;items.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;g.appendChild(o)});sel.appendChild(g)};
  og('ดาวเคราะห์ / ดวงจันทร์',BODIES.map(b=>['b:'+b[0],`${b[1]} (${b[0]})`]));
  og('ดาวฤกษ์สว่าง',brightStars.map(i=>['s:'+i,`⭐ ${starLabel(STAR_NAMES[i])} (${STAR_NAMES[i]})`]).sort((a,b)=>a[1].localeCompare(b[1],'th')));
  og('กลุ่มดาว (88 กลุ่ม)',lblIds.map(id=>['c:'+id,`${conTh(id)} (${CON_INFO[id][0]})`]).sort((a,b)=>a[1].localeCompare(b[1],'th')));
}

let lastInfo=0,selected=null;
function updateInfo(){
  const c=azAltFromEnu(view.f);
  $('dirPill').innerHTML=`🧭 <b>${Math.round(c.az)}°</b> ${COMPASS[Math.round(c.az/45)%8]} · เงย <b>${Math.round(c.alt)}°</b>`;
  // ทิศกลางจอ → RA/Dec (J2000) → Astronomy.Constellation()
  const f=view.f,hx=f[1],hy=-f[0],hz=f[2],m=sky.horEqj;
  const ex=m[0][0]*hx+m[1][0]*hy+m[2][0]*hz,ey=m[0][1]*hx+m[1][1]*hy+m[2][1]*hz,ez=m[0][2]*hx+m[1][2]*hy+m[2][2]*hz;
  const ra=wrap360(Math.atan2(ey,ex)*R2D)/15,dec=Math.asin(Math.max(-1,Math.min(1,ez)))*R2D;
  const con=A.Constellation(ra,dec);curCon=con.symbol;
  if(selected&&Date.now()-selected.t<6000){showSelected();}
  else{
    selected=null;
    $('conName').textContent=`${conTh(con.symbol)} (${con.name})`;
    let near=null,best=1e9;
    for(const h of hits){if(h.type==='con')continue;const d=Math.hypot(h.x-cx,h.y-cy);if(d<best&&d<90){best=d;near=h}}
    let sub=`RA ${ra.toFixed(2)}h · Dec ${dec.toFixed(1)}°`;
    if(near)sub=(near.type==='body'?`ใกล้กลางจอ: ${near.b.th}`:`ใกล้กลางจอ: ดาว${starLabel(near.name)} (${near.name})`)+' · '+sub;
    if(c.alt<0)sub='⬇ กำลังชี้ต่ำกว่าขอบฟ้า (ตอนนี้กลุ่มดาวนี้อยู่ใต้พื้นโลก) · '+sub;
    $('conSub').textContent=sub;
    $('lore').textContent=LORE[con.symbol]||`กลุ่มดาว${conTh(con.symbol)} เป็นหนึ่งใน 88 กลุ่มดาวสากล (IAU) ลองหมุนไปหาดาวที่สว่างกว่าใกล้ ๆ เพื่อใช้เป็นจุดสังเกต`;
  }
  updateGuide(c);
  if(sky.sunAlt>-6&&!st.cam&&!$('status').dataset.sticky)setStatus(sky.sunAlt>0?'☀️ ตอนนี้กลางวัน ตาเปล่าจะมองไม่เห็นดาว แต่ตำแหน่งในแอปถูกต้อง (ลองกด 🕘 เวลา เพื่อเลื่อนไปตอนกลางคืน)':'🌆 ช่วงพลบค่ำ ดาวสว่าง ๆ เริ่มมองเห็นได้');
}
function showSelected(){
  const s=selected;
  if(s.type==='body'){const b=s.b;$('conName').textContent=`${b.th} (${b.name})`;$('conSub').textContent=`Azimuth ${b.az.toFixed(1)}° · Altitude ${b.alt.toFixed(1)}°${b.mag!=null?` · ความสว่าง ${b.mag.toFixed(1)}`:''}`;$('lore').textContent=b.name==='Moon'?`เฟสดวงจันทร์ ${Math.round(sky.moonPhase)}° (0° = เดือนมืด, 180° = เต็มดวง)`:'ตำแหน่งดาวเคราะห์คำนวณจาก Astronomy.Equator + Astronomy.Horizon (รวมการหักเหของแสง)'}
  else{const i=s.i,v=azAltFromEnu(sky.stars.subarray(i*3,i*3+3));const cn=A.Constellation(STARS[i][0]/15,STARS[i][1]).symbol;$('conName').textContent=`⭐ ${starLabel(s.name)} (${s.name})`;$('conSub').textContent=`กลุ่มดาว${conTh(cn)} · Azimuth ${v.az.toFixed(1)}° · Altitude ${v.alt.toFixed(1)}° · ความสว่าง ${STARS[i][2]}`;$('lore').textContent=LORE[cn]||''}
}
function setStatus(t,warn){const s=$('status');s.textContent=t;s.className=warn?'warn':'';if(warn){s.dataset.sticky='1';setTimeout(()=>delete s.dataset.sticky,8000)}}
let toastT=0;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),1400)}

// ---------------- GPS ----------------
function requestGPS(){
  if(!navigator.geolocation){setStatus('เบราว์เซอร์ไม่รองรับ GPS — ใช้ตำแหน่งกรุงเทพฯ แทน',true);return}
  navigator.geolocation.getCurrentPosition(p=>{
    st.lat=p.coords.latitude;st.lon=p.coords.longitude;st.gps=true;observer=new A.Observer(st.lat,st.lon,p.coords.altitude||0);skyDirty=true;
    try{localStorage.setItem('sf_loc',JSON.stringify({lat:st.lat,lon:st.lon}))}catch(e){}
    setStatus(`📍 GPS ${st.lat.toFixed(3)}°, ${st.lon.toFixed(3)}° (±${Math.round(p.coords.accuracy)} ม.) · เซนเซอร์: ${sensorText()}`);
  },err=>{
    const why=err.code===1?'ไม่ได้รับอนุญาตตำแหน่ง':'หาตำแหน่งไม่สำเร็จ';
    setStatus(`${why} — ใช้ตำแหน่ง ${st.lat.toFixed(2)}°, ${st.lon.toFixed(2)}° แทน (ในไทยคลาดเคลื่อนไม่กี่องศา)`,true);
  },{enableHighAccuracy:true,timeout:15000,maximumAge:300000});
}
const sensorText=()=>({ios:'เข็มทิศ iPhone',abs:'เข็มทิศจริง (absolute)',rel:'ทิศสัมพัทธ์ — ลากนิ้วเพื่อปรับทิศเหนือ'})[st.kind]||(st.sensorOn?'รอข้อมูล…':'ปิด');

  const DOE=window.DeviceOrientationEvent;

});

// ---------------- ลากนิ้ว / ซูม / แตะ ----------------
const pts=new Map();let gest=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1)gest={type:'drag',x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,t:Date.now(),moved:0};
  else if(pts.size===2){const [a,b]=[...pts.values()];gest={type:'pinch',d:Math.hypot(a.x-b.x,a.y-b.y),fov:st.vfov,moved:99}}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!gest)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(gest.type==='pinch'&&pts.size===2){const [a,b]=[...pts.values()];st.vfov=Math.max(18,Math.min(100,gest.fov*gest.d/Math.max(20,Math.hypot(a.x-b.x,a.y-b.y))));return}
  if(gest.type!=='drag')return;
  const dx=e.clientX-gest.lx,dy=e.clientY-gest.ly;gest.lx=e.clientX;gest.ly=e.clientY;gest.moved+=Math.abs(dx)+Math.abs(dy);
  const k=st.vfov/H;
  if(sensorLive()){st.calib=wrap180(st.calib-dx*k);toast(`ปรับทิศเหนือ ${st.calib>0?'+':''}${st.calib.toFixed(0)}°`)}
  else{st.manAz=wrap360(st.manAz-dx*k);st.manAlt=Math.max(-89,Math.min(89,st.manAlt+dy*k))}
});
function up(e){pts.delete(e.pointerId);
  if(gest&&gest.type==='drag'&&gest.moved<10&&Date.now()-gest.t<400){
    let best=null,bd=32;for(const h of hits){const d=Math.hypot(h.x-e.clientX,h.y-e.clientY)+(h.pri?8:0);if(d<bd){bd=d;best=h}}
    if(best){if(best.type!=='con'){selected={...best,t:Date.now()};showSelected()}openStoryFor(best)}
  }
  if(pts.size===0)gest=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();st.vfov=Math.max(18,Math.min(100,st.vfov*(e.deltaY>0?1.08:0.93)))},{passive:false});

// ---------------- ตำนานดาว + อ่านออกเสียง ----------------
let storyCtx=null; // {parts, target}
function storyForCon(id,leadIn){
  const m=CON_MYTH[id]||['GENERIC'],base=MYTHS[m[0]];
  const parts=[];if(leadIn)parts.push(leadIn);if(m[1])parts.push(m[1]);
  if(m[0]==='GENERIC'||m[0]==='ANCIENT'||m[0]==='DUTCH'||m[0]==='LACAILLE'||m[0]==='HEVELIUS'){if(!m[1]&&LORE[id])parts.push(LORE[id])}
  parts.push(...base.p);
  const generic=['GENERIC','ANCIENT','DUTCH','LACAILLE','HEVELIUS'].includes(m[0]);
  return {title:generic?`กลุ่มดาว${conTh(id)}`:base.t,sub:`กลุ่มดาว${conTh(id)} (${CON_INFO[id]?CON_INFO[id][0]:id})${generic?' · '+base.t:''}`,parts,target:'c:'+id};
}
function openStoryFor(h){
  let s;
  if(h.type==='body'){const b=BODY_MYTH[h.b.name];s={title:b.t,sub:`${h.b.th} (${h.b.name})`,parts:b.p.slice(),target:'b:'+h.b.name}}
  else if(h.type==='star'){const cn=A.Constellation(STARS[h.i][0]/15,STARS[h.i][1]).symbol;s=storyForCon(cn,`ดาว${starLabel(h.name)} อยู่ในกลุ่มดาว${conTh(cn)}`);s.sub=`⭐ ดาว${starLabel(h.name)} (${h.name}) · `+s.sub}
  else s=storyForCon(h.id);
  showStory(s);
}
function showStory(s){
  ttsStop();storyCtx=s;
  $('stTitle').textContent=s.title;$('stSub').textContent=s.sub;
  const body=$('stBody');body.innerHTML='';
  s.parts.forEach((t,i)=>{const sp=document.createElement('span');sp.textContent=t+' ';sp.dataset.i=i;sp.addEventListener('click',()=>ttsStart(i));body.appendChild(sp)});
  body.scrollTop=0;
  const el=$('story');el.classList.add('open');el.setAttribute('aria-hidden','false');
  updateVoiceNote();
}
function closeStory(){ttsStop();const el=$('story');el.classList.remove('open');el.setAttribute('aria-hidden','true')}
$('stClose').addEventListener('click',closeStory);
$('storyBtn').addEventListener('click',()=>{
  if(selected&&Date.now()-selected.t<6000){openStoryFor(selected);return}
  if(curCon)openStoryFor({type:'con',id:curCon});
});
$('stFind').addEventListener('click',()=>{if(!storyCtx)return;st.target=storyCtx.target;$('target').value=storyCtx.target;riseCache={};closeStory();toast('นำทางไปยังเป้าหมายแล้ว — ดูลูกศรสีทอง')});
// Text-to-Speech (Web Speech API) อ่านทีละประโยค เพื่อไม่ให้ iOS/Chrome ตัดเสียงกลางคัน
const TTS={ok:'speechSynthesis' in window,voice:null,run:0,idx:0,playing:false,rate:0.95};
function pickVoice(){if(!TTS.ok)return;const vs=speechSynthesis.getVoices();TTS.voice=vs.find(v=>/^th(-|_|$)/i.test(v.lang))||vs.find(v=>/thai|ไทย/i.test(v.name))||null;updateVoiceNote()}
if(TTS.ok){pickVoice();speechSynthesis.addEventListener?speechSynthesis.addEventListener('voiceschanged',pickVoice):(speechSynthesis.onvoiceschanged=pickVoice)}
function updateVoiceNote(){
  const n=$('stVoiceNote');if(!n)return;
  if(!TTS.ok){n.textContent='เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง';return}
  if(!TTS.voice&&speechSynthesis.getVoices().length)n.innerHTML='เครื่องนี้ยังไม่มีเสียงภาษาไทย — iPhone: ตั้งค่า › การช่วยการเข้าถึง › เนื้อหาที่พูด › เสียง › ไทย · Android: ตั้งค่า › การอ่านออกเสียง (Text-to-speech) › ติดตั้งข้อมูลเสียงภาษาไทย';
  else n.textContent='';
}
function highlight(i){$('stBody').querySelectorAll('span').forEach(sp=>sp.classList.toggle('reading',+sp.dataset.i===i));const cur=$('stBody').querySelector('span.reading');if(cur)cur.scrollIntoView({block:'nearest',behavior:'smooth'})}
function setSpeakBtn(){const b=$('stSpeak');b.classList.toggle('playing',TTS.playing);b.textContent=TTS.playing?'⏹ หยุดอ่าน':'🔊 อ่านออกเสียง'}
function ttsStart(from){
  if(!TTS.ok||!storyCtx){setStatus('เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง',true);return}
  speechSynthesis.cancel();
  const run=++TTS.run;TTS.idx=from||0;TTS.playing=true;setSpeakBtn();
  const lines=[storyCtx.title,...storyCtx.parts];let k=from?from+1:0; // บรรทัด 0 = ชื่อเรื่อง
  const next=()=>{
    if(run!==TTS.run)return;
    if(k>=lines.length){TTS.playing=false;setSpeakBtn();highlight(-1);return}
    const u=new SpeechSynthesisUtterance(lines[k]);u.lang='th-TH';if(TTS.voice)u.voice=TTS.voice;u.rate=TTS.rate;u.pitch=1;
    highlight(k-1);
    u.onend=()=>{if(run!==TTS.run)return;k++;setTimeout(next,180)};
    u.onerror=ev=>{if(run!==TTS.run)return;if(ev.error==='interrupted'||ev.error==='canceled')return;k++;setTimeout(next,180)};
    speechSynthesis.speak(u);
  };
  next();
  // กัน Chrome Android หยุดเงียบ ๆ เมื่อพูดนาน
  clearInterval(TTS.keep);TTS.keep=setInterval(()=>{if(run!==TTS.run||!TTS.playing){clearInterval(TTS.keep);return}if(speechSynthesis.paused)speechSynthesis.resume()},4000);
}
function ttsStop(){TTS.run++;TTS.playing=false;if(TTS.ok)speechSynthesis.cancel();setSpeakBtn();highlight(-1)}
$('stSpeak').addEventListener('click',()=>{TTS.playing?ttsStop():ttsStart(0)});
$('stRate').addEventListener('click',e=>{const slow=TTS.rate>0.9;TTS.rate=slow?0.75:0.95;e.currentTarget.textContent=slow?'ปกติ':'ช้า';e.currentTarget.classList.toggle('on',slow);if(TTS.playing){const i=Math.max(0,+(($('stBody').querySelector('span.reading')||{}).dataset||{}).i||0);ttsStart(i)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)ttsStop()});

// ---------------- ลูป ----------------
window.addEventListener('resize',resize);
resize();buildTargetList();computeSky();manualTarget();view={...target};
setStatus(`ตำแหน่ง ${st.lat.toFixed(2)}°, ${st.lon.toFixed(2)}° · ลากนิ้วเพื่อหมุน · สองนิ้วเพื่อซูม`);
function frame(){
  requestAnimationFrame(frame);
  try{
    if(skyDirty||Date.now()-lastSky>2000)computeSky();
    updateView();render();
    if(Date.now()-lastInfo>200){lastInfo=Date.now();updateInfo()}
  }catch(err){console.error(err)}
}
frame();
window.__sf={st,view:()=>view,sky:()=>sky,setTargetFromMatrix,euler,onOrient}; // สำหรับทดสอบ
})();
</script>
<div id="redFilter"></div>
